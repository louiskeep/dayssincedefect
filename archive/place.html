<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cubicle Layout Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#3a2b45;--card:#fffdf6;--stroke:#3a2b45;--shadow:rgba(58,43,69,.22);--blue:#2f9bff;--green:#37c06a;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Baloo 2",system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#bfe6ff,#e8f4ff 34%,#ffe6c2);min-height:100vh;padding:14px;}
  .wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
  h1{font-family:"Fredoka";margin:0;}
  .hint{color:#7c6a53;font-weight:700;margin:0;}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .btn{font-family:"Baloo 2";font-weight:800;cursor:pointer;color:#fff;background:var(--blue);
    border:3px solid var(--stroke);border-radius:12px;padding:9px 16px;box-shadow:0 4px 0 var(--shadow);}
  .btn.green{background:var(--green);} .btn.ghost{background:#fff3dc;color:var(--ink);}
  .btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow);}
  .sel{font-weight:800;color:var(--blue);}
  .stage{position:relative;width:100%;aspect-ratio:3/2;border:3px solid var(--stroke);border-radius:16px;
    overflow:hidden;box-shadow:0 6px 0 var(--shadow);
    background:#3a3550 url("assets/cubicle-empty-1.png") center/cover no-repeat;touch-action:none;}
  .obj{position:absolute;transform:translate(-50%,-100%);cursor:grab;user-select:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));}
  .obj.on{outline:2px dashed var(--blue);outline-offset:2px;}
  .obj.hero{filter:drop-shadow(0 4px 3px rgba(0,0,0,.4));}
  .lbl{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.9);border:2px solid var(--stroke);
    border-radius:8px;padding:3px 9px;font-weight:800;font-size:.85em;pointer-events:none;}
  .handle{position:absolute;width:20px;height:20px;background:var(--blue);border:3px solid #fff;
    border-radius:5px;cursor:nwse-resize;z-index:99;transform:translate(-50%,-50%);display:none;
    box-shadow:0 2px 4px rgba(0,0,0,.4);}
  .handle.show{display:block;}
  textarea{width:100%;height:150px;font-family:monospace;font-size:.72rem;border:3px solid var(--stroke);
    border-radius:10px;padding:8px;background:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🪑 Cubicle Layout Editor</h1>
  <p class="hint">Drag to move · scroll wheel (or −/=) to resize · click to select. Selected: <span class="sel" id="selName">none</span></p>
  <div class="bar">
    <button class="btn green" id="copy">📋 Copy layout</button>
    <button class="btn ghost" id="tidy">Line items up (to place)</button>
    <button class="btn ghost" id="reset">Reset</button>
    <span class="hint" id="xy"></span>
  </div>
  <div class="stage" id="stage"><div class="lbl" id="lbl"></div></div>
  <textarea id="out" readonly></textarea>
</div>
<script src="place.js"></script>
</body>
</html>
